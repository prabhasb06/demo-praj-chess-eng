name: Engine regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-engine.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: ln -s /usr/games/stockfish stockfish.exe
      - run: python -m unittest tests test_audit test_release -v
      - run: python alpha_beta.py
  windows-release:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv-release
      - run: .\.venv-release\Scripts\python.exe -m pip install -r requirements-release.txt
      - run: .\.venv-release\Scripts\python.exe -m unittest tests test_audit test_release -v
      - run: .\.venv-release\Scripts\python.exe alpha_beta.py
      - run: .\.venv-release\Scripts\python.exe prepare_release.py --binary
      - name: Validate packaged engine without Stockfish
        shell: pwsh
        run: |
          $env:PRAJ_ENGINE_EXE = (Get-ChildItem dist/release-2.1-*/bin/praj.exe).FullName
          .\.venv-release\Scripts\python.exe -m unittest test_audit.AuditProtocol -v
